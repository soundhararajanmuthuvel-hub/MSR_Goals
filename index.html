<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MSR Goals</title>

  <meta
    name="theme-color"
    content="#22c55e"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    href="icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="icon-192.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>
<body>

  <div class="container">

    <h1 class="logo">
      MSR Goals
    </h1>

    <div class="top-card">

      <p class="top-title">
        Total Savings Overview
      </p>

      <div id="totalSaved"></div>

    </div>

    <div class="common-box">

      <h3>
        Common Savings
      </h3>

      <input
        type="number"
        id="commonSavings"
        placeholder="Enter Total Savings"
      >

      <button onclick="saveCommonSavings()">
        Save Amount
      </button>

    </div>

    <div class="form">

      <div class="input-box">

        <span>🎯</span>

        <input
          type="text"
          id="goalName"
          placeholder="Goal Name"
        >

      </div>

      <div class="input-box">

        <span>₹</span>

        <input
          type="number"
          id="goalAmount"
          placeholder="Target Amount"
        >

      </div>

      <button onclick="addGoal()">
        Add Goal
      </button>

    </div>

    <h2 class="goal-title">
      Your Goals
    </h2>

    <div id="goalList"></div>

    <p class="footer">
      Data is saved locally on your device.
    </p>

  </div>

  <script src="script.js"></script>

</body>
</html>
